<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Administrador de Pacientes</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <!--<link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css">   -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2 class="text-center titulo" data-cy="titulo-proyecto">Administrador de Pacientes de Veterinaria</h2>
    <div class="container mt-0 p-4 ">
        <div id="contenido" class="row">
            <div class="col-md-6 gap-3 flex flex-col align-items-center justify-content-center p-4">
                <form id="nueva-cita" data-cy="formulario">
                    <legend class="mb-4 text-center">Datos del Paciente</legend>
                    <div class="form-group input__container">
                        <label class="col-form-label">Nombre Mascota</label>
                        <div >
                            <input type="text" id="mascota" name="mascota" class="form-control" placeholder="Nombre Mascota" data-cy="cy-mascota">
                        </div>
                    </div>
                    <div class="form-group input__container">
                        <label class="col-form-label">Propietario</label>
                        <div >
                            <input type="text" id="propietario" name="propietario" class="form-control"  placeholder="Nombre Dueño de la Mascota" data-cy="cy-propietario">
                        </div>
                    </div>

                    <div class="form-group input__container">
                        <label class="col-form-label">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control"  placeholder="Número de Teléfono" data-cy="cy-telefono">
                    </div>

                    <div class="form-group input__container">
                        <label class="col-form-label">Fecha</label>
                        <div >
                            <input type="date" id="fecha" name="fecha" class="form-control" data-cy="cy-fecha">
                        </div>
                    </div>

                    <div class="form-group input__container">
                        <label class="col-form-label">Hora</label>
                        <div >
                            <input type="time" id="hora" name="hora" class="form-control" data-cy="cy-hora">
                        </div>
                    </div>

                    <div class="textarea__container form-group flex flex-column">
                        <label class="col-form-label">Sintomas</label>
                        <textarea id="sintomas" name="sintomas" class="form-control" data-cy="cy-sintomas"></textarea>
                    </div>

                    <div class="form-group">
                            <button type="submit" class="boton btn-lg w-75 d-block mx-auto btn__crear__cita" data-cy="cy-btnEnviar">Crear Cita</button>
                    </div>
                </form>
                <button type="reset" class="mt-4 boton d-block btn-lg mx-auto btn__limpiar" id="limpiarCitas" data-cy="cy-btnLimpiar">Limpiar</button>
            </div>             

            <div class="col-md-6">
                <h2 id="administra" class="border border-5 rounded rounded-2 text-center translate-middle p-2 mb-2">Administra tus Citas</h2>
               
                <ul id="citas" class="list-group lista-citas mt-1"></ul>
            </div>
        </div> <!--.row-->
    </div><!--.container-->
    <script type="module" src="js/app.js"></script>

</body>
</html>
